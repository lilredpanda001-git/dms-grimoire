services:
  - type: web
    name: dms-grimoire-mcp
    runtime: node
    rootDir: mcp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_ENDPOINT
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT_MS
        value: "180000"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: dms-grimoire-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_BASE_URL
        fromService:
          type: web
          name: dms-grimoire-mcp
          property: host
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: dms-grimoire-frontend
          property: host
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false

  - type: web
    name: dms-grimoire-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: dms-grimoire-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
